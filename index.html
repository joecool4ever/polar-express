<!DOCTYPE html>
<html>
<head>
    <title>CypherPixelExpress</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png" type="image/x-icon">

    <style>
        html, body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;

        }

        #start {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 1000;
            transform: translate(-50%, -50%);
        }

        #share_gif {
            background-color: white;
            width: auto;
            height: 100vh ;
            object-fit: fill;
        }

        @media (max-width: 600px) {
            #share_gif {
                width: auto;
                height: 100vw;
                transform: rotate(90deg);
                object-fit: cover;
                display:block;
            }

            #start {
                position: absolute;
                top: 50%;
                left: 50%;
                z-index: 1000;
                transform: rotate(90deg), translate(-50%, -50%);
            }
        }
    </style>
</head>
<body>
    <button id="start">🚂 Believe 🎄</button>

    <img id="share_gif" src="gifs/youcoming.gif" alt="">

</body>
<script>

    const audio = new Audio("believe-official-audio.mp3");

    document.getElementById("start").addEventListener("click", () => {
        audio.play();
        setInterval(changeGif, 3000);
        document.getElementById("start").style.display = "none";
    });

    const imageElement = document.getElementById("share_gif")

    const gifs = [
        "gifs/all-aboard.gif",
        "gifs/yessss.gif",
        "gifs/letsdothisthing.gif",
        "gifs/hotchocolate.gif",
        "gifs/iloveyouelf.gif",
        "gifs/northpole.gif",
        "gifs/believe.gif",
        
    ]

    let currentGifIndex = 0;

    function changeGif() {
        imageElement.src = gifs[currentGifIndex];
        currentGifIndex = (currentGifIndex + 1) % gifs.length;
    }

    
</script>
</html>
