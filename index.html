<!DOCTYPE html>
<html>
<head>
    <title>CypherPixelExpress</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png" type="image/x-icon">

    <style>
        html, body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;

        }

        #share_gif {
            background-color: white;
            width: 100vw;
            height: auto ;
            object-fit: fill;
        }

        @media (max-width: 600px) {
            #share_gif {
                width: 100vh;
                height: auto;
                transform: rotate(90deg);
                object-fit: cover;
                display:block;
            }
        }
    </style>
</head>
<body>

<img id="share_gif" src="gifs/believe.gif" alt="">

</body>
<script>
    const imageElement = document.getElementById("share_gif")

    const gifs = [
        "gifs/believe.gif",
        "gifs/all-aboard.gif"
    ]

    let currentGifIndex = 0;

    function changeGif() {
        imageElement.src = gifs[currentGifIndex];
        currentGifIndex = (currentGifIndex + 1) % gifs.length;
    }

    setInterval(changeGif, 2000);
</script>
</html>
